<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dashboard - TypeTone</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

:root{
    --bg:#030304;
    --card:rgba(255,255,255,0.03);
    --border:rgba(255,255,255,0.08);
    --text:#fff;
    --muted:#94a3b8;
    --accent:#60a5fa;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

.bg{
    position:fixed;
    inset:0;
    z-index:-1;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.35;
}

.orb1{
    width:500px;
    height:500px;
    background:#2563eb;
    top:-150px;
    right:-120px;
}

.orb2{
    width:500px;
    height:500px;
    background:#7c3aed;
    bottom:-180px;
    left:-120px;
}

nav{
    padding:22px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,0.05);
    position:sticky;
    top:0;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:26px;
    font-weight:800;
}

.logo-box{
    width:22px;
    height:22px;
    border-radius:6px;
    background:linear-gradient(135deg,#60a5fa,#8b5cf6);
}

.logout-btn{
    padding:12px 22px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.06);
    color:white;
    cursor:pointer;
    font-weight:600;
}

main{
    width:90%;
    max-width:1300px;
    margin:auto;
    padding:60px 0;
}

.welcome{
    margin-bottom:50px;
}

.welcome h1{
    font-size:48px;
    margin-bottom:10px;
}

.welcome p{
    color:var(--muted);
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:25px;
    margin-bottom:60px;
}

.stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:30px;
    backdrop-filter:blur(20px);
}

.stat-title{
    color:var(--muted);
    font-size:14px;
    margin-bottom:12px;
    text-transform:uppercase;
}

.stat-value{
    font-size:42px;
    font-weight:800;
}

.section-title{
    font-size:26px;
    margin-bottom:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:26px;
    padding:35px;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
    border-color:rgba(255,255,255,0.15);
}

.icon{
    font-size:38px;
    margin-bottom:18px;
}

.card h3{
    font-size:24px;
    margin-bottom:12px;
}

.card p{
    color:var(--muted);
    line-height:1.7;
    margin-bottom:22px;
}

.launch{
    color:#60a5fa;
    font-weight:700;
}

footer{
    text-align:center;
    padding:40px;
    color:var(--muted);
}

</style>
</head>

<body>

<div class="bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
</div>

<nav>

    <div class="logo">
        <div class="logo-box"></div>
        TypeTone
    </div>

    <!-- BUTTON KEPT INTACT -->
    <button class="logout-btn"
            onclick="logout()">

        Logout

    </button>

</nav>

<main>

    <div class="welcome">

        <h1 id="welcome">
            Loading...
        </h1>

        <p>
            Welcome back to your dashboard.
        </p>

    </div>

    <div class="stats">

        <div class="stat-card">

            <div class="stat-title">
                Latest WPM
            </div>

            <div class="stat-value"
                 id="latestWPM">

                0

            </div>

        </div>

        <div class="stat-card">

            <div class="stat-title">
                Tests Attempted
            </div>

            <div class="stat-value"
                 id="testsAttempted">

                0

            </div>

        </div>

        <div class="stat-card">

            <div class="stat-title">
                Age
            </div>

            <div class="stat-value"
                 id="age">

                0

            </div>

        </div>

    </div>

    <h2 class="section-title">
        Applications
    </h2>

    <div class="cards">

        <!-- BUTTONS KEPT INTACT -->

        <div class="card"
             onclick="window.location.href='piano.html'">

            <div class="icon">🎹</div>

            <h3>Piano For Typists</h3>

            <p>
                Turn your keyboard into a musical piano.
            </p>

            <div class="launch">
                Launch →
            </div>

        </div>

        <div class="card"
             onclick="window.location.href='typingtest.html'">

            <div class="icon">⌨️</div>

            <h3>Typing Speed Test</h3>

            <p>
                Test your speed and save scores live.
            </p>

            <div class="launch">
                Start Test →
            </div>

        </div>

    </div>

</main>

<footer>

    © 2026 TypeTone

</footer>

<script type="module">

import { db } from './firebase.js';

import {
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const user =
    JSON.parse(localStorage.getItem("user"));

if(!user){

    window.location.href =
        "index.html";
}

document.getElementById("welcome")
.innerText =
    "Hello, " + user.name;

async function loadData(){

    try{

        const userRef =
            doc(db,"users",user.uid);

        const snap =
            await getDoc(userRef);

        if(snap.exists()){

            const data = snap.data();

            document
            .getElementById("latestWPM")
            .innerText =
                data.latestWPM || 0;

            document
            .getElementById("testsAttempted")
            .innerText =
                data.testsAttempted || 0;

            document
            .getElementById("age")
            .innerText =
                data.age || "N/A";
        }
    }

    catch(error){

        console.log(error);
    }
}

loadData();

window.logout = function(){

    localStorage.clear();

    window.location.href =
        "index.html";
}

</script>

</body>
</html>
