<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Typing Speed Test</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f1117;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

nav{
    background:#171b26;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
    padding-top:50px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:20px;
}

.timer{
    font-size:26px;
    font-weight:bold;
    color:#6ea8ff;
}

.score{
    font-size:22px;
}

.passage-box{
    background:#171b26;
    padding:35px;
    border-radius:25px;
    line-height:2.1;
    font-size:24px;
    min-height:220px;
}

.correct{
    color:#4caf50;
}

.wrong{
    color:#ff5252;
    background:rgba(255,82,82,0.2);
    border-radius:4px;
}

.current{
    border-left:2px solid #6ea8ff;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        border-color:transparent;
    }
}

textarea{
    width:100%;
    margin-top:35px;
    height:180px;
    background:#171b26;
    border:none;
    outline:none;
    color:white;
    padding:25px;
    border-radius:20px;
    font-size:22px;
    resize:none;
}

.buttons{
    display:flex;
    gap:20px;
    margin-top:25px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.restart{
    background:#6ea8ff;
}

.back{
    background:#222;
    color:white;
}

.result-box{
    margin-top:35px;
    background:#171b26;
    padding:25px;
    border-radius:20px;
    display:none;
}

</style>
</head>

<body>

<nav>

    <div class="logo">
        TypeTone
    </div>

    <!-- BUTTON KEPT INTACT -->
    <button class="back"
            onclick="window.location.href='dashboard.html'">

        Back To Dashboard

    </button>

</nav>

<div class="container">

    <div class="top-bar">

        <div class="timer">
            Time Left:
            <span id="time">30</span>s
        </div>

        <div class="score">
            WPM:
            <span id="wpm">0</span>
        </div>

    </div>

    <div class="passage-box"
         id="passage"></div>

    <textarea
        id="inputBox"
        placeholder="Start typing here...">
    </textarea>

    <div class="buttons">

        <button class="restart"
                onclick="restartTest()">

            Restart Test

        </button>

    </div>

    <div class="result-box"
         id="resultBox">

        <h2>
            Test Completed
        </h2>

        <p id="finalResult"></p>

    </div>

</div>

<script type="module">

import { db } from './firebase.js';

import {
    doc,
    updateDoc,
    increment
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const passages = [

`Music and typing together create a surprisingly enjoyable experience. Fast typists can naturally play melodies using keyboard muscle memory while improving rhythm and coordination through practice every single day.`,

`The quick brown fox jumps over the lazy dog while musicians continue practicing piano scales carefully to improve finger control speed and timing accuracy during performance sessions and live concerts.`,

`Typing tests improve concentration and accuracy over time. Consistent practice allows people to increase speed while reducing mistakes and building stronger keyboard familiarity naturally through repetition.`,

`Creative programmers often combine sound interaction animation and responsive typing mechanics to build unique browser experiences that feel smooth fast immersive and highly engaging to users worldwide.`,

`Learning keyboard piano layouts can become intuitive when notes are arranged ergonomically. Smooth movement between keys allows melodies to flow comfortably during rapid playing and advanced performances.`,

`Modern web applications rely heavily on responsive design smooth animations and efficient data handling techniques. Developers constantly optimize performance to provide seamless experiences for users across devices.`,

`Practicing typing regularly strengthens finger memory improves concentration and increases productivity during daily computer usage. Accurate typing also reduces fatigue and helps maintain a consistent workflow.`,

`Musicians often train their hands independently to improve coordination timing and flexibility. Combining music with typing exercises creates an enjoyable and highly productive learning environment for beginners.`

];

let selectedPassage = "";
let timerStarted = false;
let timeLeft = 30;
let timer;
let correctChars = 0;

const passageElement =
    document.getElementById('passage');

const inputBox =
    document.getElementById('inputBox');

function loadPassage(){

    selectedPassage =
        passages[
            Math.floor(
                Math.random()*passages.length
            )
        ];

    passageElement.innerHTML = "";

    selectedPassage
    .split("")
    .forEach(char=>{

        const span =
            document.createElement('span');

        span.innerText = char;

        passageElement.appendChild(span);
    });

    passageElement.children[0]
    .classList.add('current');
}

loadPassage();

inputBox.addEventListener('input',()=>{

    const typed =
        inputBox.value;

    const chars =
        passageElement.querySelectorAll('span');

    if(!timerStarted){

        startTimer();

        timerStarted = true;
    }

    correctChars = 0;

    chars.forEach((charSpan,index)=>{

        const typedChar = typed[index];

        charSpan.classList.remove(
            'correct',
            'wrong',
            'current'
        );

        if(typedChar == null){

            charSpan.classList.add('current');
        }

        else if(
            typedChar === charSpan.innerText
        ){

            charSpan.classList.add('correct');

            correctChars++;
        }

        else{

            charSpan.classList.add('wrong');
        }

    });

    calculateWPM();
});

function startTimer(){

    timer = setInterval(()=>{

        timeLeft--;

        document
        .getElementById('time')
        .innerText = timeLeft;

        calculateWPM();

        if(timeLeft <= 0){

            endTest();
        }

    },1000);
}

function calculateWPM(){

    const timeSpent =
        30 - timeLeft;

    if(timeSpent <= 0) return;

    const wordsTyped =
        correctChars / 5;

    const minutes =
        timeSpent / 60;

    const wpm =
        Math.round(wordsTyped / minutes);

    document
    .getElementById('wpm')
    .innerText = wpm;
}

async function endTest(){

    clearInterval(timer);

    inputBox.disabled = true;

    const finalWPM =
        document.getElementById('wpm')
        .innerText;

    document
    .getElementById('resultBox')
    .style.display = 'block';

    document
    .getElementById('finalResult')
    .innerText =
        `Your typing speed was ${finalWPM} WPM`;

    const user =
        JSON.parse(
            localStorage.getItem('user')
        );

    if(user){

        try{

            const userRef =
                doc(db,'users',user.uid);

            await updateDoc(userRef,{

                latestWPM: finalWPM,

                testsAttempted:
                    increment(1)
            });

            console.log("Saved");

        }

        catch(error){

            console.log(error);
        }
    }
}

window.restartTest = function(){

    clearInterval(timer);

    timerStarted = false;

    timeLeft = 30;

    correctChars = 0;

    document
    .getElementById('time')
    .innerText = timeLeft;

    document
    .getElementById('wpm')
    .innerText = 0;

    inputBox.disabled = false;

    inputBox.value = '';

    document
    .getElementById('resultBox')
    .style.display = 'none';

    loadPassage();
}

</script>

</body>
</html>
